name: Deploy

# Live deploy (R11, D74, D77): after CI passes on a push to main, or by hand. Migrate Neon, then ask Render to deploy the
# API, then publish the client and its Pages Function proxy. Each step skips with a notice when its secret is absent.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are given only to the steps that use them, so checkout, setup and install never see them.
    steps:
      - name: Check which deploy secrets are set
        id: gate
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          check() { if [ -n "$2" ]; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$3"; fi; }
          check migrate "$PROD_DATABASE_URL" "PROD_DATABASE_URL is not set; skipping migrations."
          check api "$RENDER_DEPLOY_HOOK_URL" "RENDER_DEPLOY_HOOK_URL is not set; skipping the API deploy."
          both=""; [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && both=1
          check pages "$both" "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set; skipping the client deploy."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.migrate == 'true' || steps.gate.outputs.pages == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.gate.outputs.migrate == 'true' || steps.gate.outputs.pages == 'true'
        with:
          node-version: '24'
          cache: true
      - if: steps.gate.outputs.migrate == 'true' || steps.gate.outputs.pages == 'true'
        run: vp install
      - name: Migrate the production database
        if: steps.gate.outputs.migrate == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        # dbmate's scripts read ../.env; the value comes from the step env.
        run: touch .env && vp run server#db:migrate
      - name: Deploy the API on Render
        if: steps.gate.outputs.api == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST -o /dev/null "$RENDER_DEPLOY_HOOK_URL"
      - name: Build the client
        if: steps.gate.outputs.pages == 'true'
        env:
          # Public by design (a browser DSN ships in the bundle); empty leaves client error reporting off.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: vp run client#build
      - name: Deploy the client and proxy to Cloudflare Pages
        if: steps.gate.outputs.pages == 'true'
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'notalah' }}
        # Run from client/ so wrangler bundles client/functions as the Pages Function.
        run: vp dlx wrangler@4.151.1 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
