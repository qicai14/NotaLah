name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notalah
          POSTGRES_PASSWORD: notalah
          POSTGRES_DB: notalah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notalah -d notalah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah?sslmode=disable
      TEST_DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah_test?sslmode=disable
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
      PGPASSWORD: notalah
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - name: Install ffmpeg (video upload tests)
        timeout-minutes: 6
        # apt mirrors occasionally hang; retry with a per-attempt limit instead of waiting for the job timeout
        run: for i in 1 2 3; do timeout 100 sh -c 'sudo apt-get update && sudo apt-get install -y ffmpeg' && exit 0; sleep 5; done; exit 1
      - run: vp install
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - name: Create empty .env (dbmate scripts require the file; values come from job env)
        run: touch .env
      - name: Create test database
        run: psql -h localhost -U notalah -d postgres -c "CREATE DATABASE notalah_test"
      - name: Check (format, lint, types)
        run: vp run --no-cache check
      - name: Test (server and client)
        run: vp run -r test
      - name: Build
        run: vp run -r build
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
