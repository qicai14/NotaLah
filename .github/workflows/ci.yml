name: CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notalah
          POSTGRES_PASSWORD: notalah
          POSTGRES_DB: notalah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notalah -d notalah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah?sslmode=disable
      TEST_DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah_test?sslmode=disable
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
      PGPASSWORD: notalah
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - name: Install ffmpeg (video upload tests)
        timeout-minutes: 6
        # apt mirrors occasionally hang; retry with a per-attempt limit instead of waiting for the job timeout
        run: for i in 1 2 3; do timeout 100 sh -c 'sudo apt-get update && sudo apt-get install -y ffmpeg' && exit 0; sleep 5; done; exit 1
      - run: vp install
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - name: Create empty .env (dbmate scripts require the file; values come from job env)
        run: touch .env
      - name: Create test database
        run: psql -h localhost -U notalah -d postgres -c "CREATE DATABASE notalah_test"
      - name: Check (format, lint, types)
        run: vp run --no-cache check
      - name: Test (server and client)
        run: vp run -r test
      - name: Build
        run: vp run -r build
      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  cage:
    # Test cage (#151): a PR may not weaken its own tests without a "Test-change: <TC id> <reason>" line in its body.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
      - name: Test-edit guard
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-test-edits.mjs

  crap:
    # Test cage (#151): a function touched by the PR may not score CRAP above 30 (CC^2 * (1-coverage)^3 + CC).
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notalah
          POSTGRES_PASSWORD: notalah
          POSTGRES_DB: notalah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notalah -d notalah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah?sslmode=disable
      TEST_DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah_test?sslmode=disable
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
      PGPASSWORD: notalah
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does the PR touch server/src or shared/src?
        id: touched
        run: |
          if git diff --name-only "$BASE_REF...HEAD" | grep -qE '^(server|shared)/src/'; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.yes
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - if: steps.touched.outputs.yes
        name: Install ffmpeg (video upload tests)
        run: for i in 1 2 3; do timeout 100 sh -c 'sudo apt-get update && sudo apt-get install -y ffmpeg' && exit 0; sleep 5; done; exit 1
      - if: steps.touched.outputs.yes
        run: vp install && touch .env
      - if: steps.touched.outputs.yes
        run: psql -h localhost -U notalah -d postgres -c "CREATE DATABASE notalah_test"
      - if: steps.touched.outputs.yes
        name: Server tests with coverage
        run: vp run server#test --coverage
      - if: steps.touched.outputs.yes
        name: CRAP gate on changed functions
        run: node scripts/crap.mjs server/coverage/coverage-final.json 30

  e2e:
    # Non-blocking: nothing needs it, and the owner makes it a required check in branch protection after a week green.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notalah
          POSTGRES_PASSWORD: notalah
          POSTGRES_DB: notalah_test_81
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notalah -d notalah_test_81"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah_test_81?sslmode=disable
      E2E_DATABASE_URL: postgres://notalah:notalah@localhost:5432/notalah_test_81?sslmode=disable
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - name: Create empty env file (dbmate scripts require it; values come from job env)
        run: touch .env
      - run: vp exec playwright install --with-deps chromium
      - name: E2E (globalSetup migrates and reseeds notalah_test_81; the AI stub is started by playwright.config; no real key)
        run: vp run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results

  audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - name: Audit production dependencies
        run: vp pm audit --production --level high
