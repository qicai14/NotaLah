name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parp
          POSTGRES_PASSWORD: parp
          POSTGRES_DB: parp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parp -d parp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://parp:parp@localhost:5432/parp?sslmode=disable
      TEST_DATABASE_URL: postgres://parp:parp@localhost:5432/parp_test?sslmode=disable
      JWT_SECRET: ci-only-dummy-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
      PGPASSWORD: parp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create empty .env (dbmate scripts require the file; values come from job env)
        run: touch .env
      - name: Create test database
        run: psql -h localhost -U parp -d postgres -c "CREATE DATABASE parp_test"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
