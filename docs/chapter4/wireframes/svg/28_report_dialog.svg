<text x="607.91" y="182.58" font-size="13.68" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="607.91" y="234.33" font-size="33.74" font-weight="750" letter-spacing="-0.84" fill="#181818">Normalisation, 1NF to</text>
<text x="607.91" y="270.77" font-size="33.74" font-weight="750" letter-spacing="-0.84" fill="#181818">3NF</text>
<rect x="607.91" y="289.78" width="392.19" height="76.66" rx="10.94" fill="#f4f4f4"/>
<text x="623.41" y="326.28" font-size="20.06" font-weight="650" fill="#181818">1NF</text>
<text x="682.67" y="326.27" font-size="16.42" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="682.67" y="348.42" font-size="16.42" fill="#4b4b4b">row.</text>
<rect x="607.91" y="381.02" width="392.19" height="76.66" rx="10.94" fill="#f4f4f4"/>
<text x="623.41" y="417.51" font-size="20.06" font-weight="650" fill="#181818">2NF</text>
<text x="682.67" y="417.5" font-size="16.42" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="682.67" y="439.66" font-size="16.42" fill="#4b4b4b">composite key.</text>
<rect x="607.91" y="472.25" width="392.19" height="76.66" rx="10.94" fill="#f4f4f4"/>
<text x="623.41" y="508.75" font-size="20.06" font-weight="650" fill="#181818">3NF</text>
<text x="682.67" y="508.73" font-size="16.42" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="711.84" y="530.89" font-size="16.42" fill="#4b4b4b">columns.</text>
<rect x="607.91" y="563.48" width="392.19" height="69.47" rx="10.94" fill="#e9e9e9"/>
<text x="623.41" y="593.4" font-size="15.05" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="623.41" y="614.46" font-size="15.05" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
