<text x="34.25" y="182.21" font-size="9.54" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="34.25" y="218.52" font-size="23.53" font-weight="750" letter-spacing="-0.59" fill="#181818">Normalisation, 1NF to</text>
<text x="34.25" y="243.92" font-size="23.53" font-weight="750" letter-spacing="-0.59" fill="#181818">3NF</text>
<rect x="34.25" y="257.23" width="273.5" height="52.97" rx="7.63" fill="#f4f4f4"/>
<text x="45.05" y="282.07" font-size="13.99" font-weight="650" fill="#181818">1NF</text>
<text x="86.38" y="282.02" font-size="11.45" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="86.38" y="297.47" font-size="11.45" fill="#4b4b4b">row.</text>
<rect x="34.25" y="320.38" width="273.5" height="52.97" rx="7.63" fill="#f4f4f4"/>
<text x="45.05" y="345.21" font-size="13.99" font-weight="650" fill="#181818">2NF</text>
<text x="86.38" y="345.16" font-size="11.45" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="86.38" y="360.61" font-size="11.45" fill="#4b4b4b">composite key.</text>
<rect x="34.25" y="383.52" width="273.5" height="52.97" rx="7.63" fill="#f4f4f4"/>
<text x="45.05" y="408.35" font-size="13.99" font-weight="650" fill="#181818">3NF</text>
<text x="86.38" y="408.3" font-size="11.45" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="106.7" y="423.75" font-size="11.45" fill="#4b4b4b">columns.</text>
<rect x="34.25" y="446.66" width="273.5" height="48.44" rx="7.63" fill="#e9e9e9"/>
<text x="45.05" y="467.54" font-size="10.49" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="45.05" y="482.23" font-size="10.49" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
