<text x="1022.39" y="176.38" font-size="3.6" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="1022.39" y="189.11" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">Normalisation, 1NF to</text>
<text x="1022.39" y="198.69" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">3NF</text>
<rect x="1022.39" y="204.41" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="1026.47" y="213.69" font-size="5.28" font-weight="650" fill="#181818">1NF</text>
<text x="1042.06" y="213.79" font-size="4.32" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="1042.06" y="219.61" font-size="4.32" fill="#4b4b4b">row.</text>
<rect x="1022.39" y="229.05" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="1026.47" y="238.33" font-size="5.28" font-weight="650" fill="#181818">2NF</text>
<text x="1042.06" y="238.43" font-size="4.32" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="1042.06" y="244.25" font-size="4.32" fill="#4b4b4b">composite key.</text>
<rect x="1022.39" y="253.69" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="1026.47" y="262.97" font-size="5.28" font-weight="650" fill="#181818">3NF</text>
<text x="1042.06" y="263.07" font-size="4.32" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="1049.73" y="268.89" font-size="4.32" fill="#4b4b4b">columns.</text>
<rect x="1022.39" y="278.33" width="103.22" height="18.25" rx="2.88" fill="#e9e9e9"/>
<text x="1026.47" y="286.07" font-size="3.96" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="1026.47" y="291.6" font-size="3.96" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
<text x="936" y="339.31" font-size="14" font-weight="650" fill="#181818">Normalisation, 1NF to 3NF in one page</text>
<text x="936" y="359.28" font-size="12" fill="#777777">Aina Rahman · CT030-3-2</text>
<rect x="924" y="383.69" width="305.03" height="59.19" rx="18" fill="#e9e9e9"/>
<text x="938" y="409" font-size="14" fill="#181818">Hi, on slide 3, why does customer_name</text>
<text x="938" y="428.59" font-size="14" fill="#181818">move out but order_date stays in ORDER_T?</text>
<rect x="900" y="747.11" width="540" height="152.89" fill="#ffffff"/>
<text x="947.8" y="780.42" font-size="14" fill="#4b4b4b">Hafiz is not your friend, so this is a request. Accept to reply; it opens this</text>
<text x="935.98" y="800.72" font-size="14" fill="#4b4b4b">conversation only and does not make you friends. Hafiz cannot see that you</text>
<text x="1132.27" y="821.01" font-size="14" fill="#4b4b4b">have read it.</text>
