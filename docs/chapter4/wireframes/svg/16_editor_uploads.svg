<text x="773.19" y="188.17" font-size="10.8" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="773.19" y="228.4" font-size="26.64" font-weight="750" letter-spacing="-0.67" fill="#181818">Normalisation, 1NF to</text>
<text x="773.19" y="257.16" font-size="26.64" font-weight="750" letter-spacing="-0.67" fill="#181818">3NF</text>
<rect x="773.19" y="272.39" width="309.63" height="59.56" rx="8.64" fill="#f4f4f4"/>
<text x="785.42" y="300.26" font-size="15.84" font-weight="650" fill="#181818">1NF</text>
<text x="832.22" y="300.07" font-size="12.96" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="832.22" y="317.55" font-size="12.96" fill="#4b4b4b">row.</text>
<rect x="773.19" y="343.47" width="309.63" height="59.56" rx="8.64" fill="#f4f4f4"/>
<text x="785.42" y="371.34" font-size="15.84" font-weight="650" fill="#181818">2NF</text>
<text x="832.22" y="371.14" font-size="12.96" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="832.22" y="388.63" font-size="12.96" fill="#4b4b4b">composite key.</text>
<rect x="773.19" y="414.55" width="309.63" height="59.56" rx="8.64" fill="#f4f4f4"/>
<text x="785.42" y="442.42" font-size="15.84" font-weight="650" fill="#181818">3NF</text>
<text x="832.22" y="442.22" font-size="12.96" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="855.25" y="459.71" font-size="12.96" fill="#4b4b4b">columns.</text>
<rect x="773.19" y="485.63" width="309.63" height="54.84" rx="8.64" fill="#e9e9e9"/>
<text x="785.42" y="509.35" font-size="11.88" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="785.42" y="525.98" font-size="11.88" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
</g>
</g>
