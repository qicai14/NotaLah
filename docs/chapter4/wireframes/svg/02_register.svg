<text x="1324.02" y="41.15" font-size="14" font-weight="650" fill="#ffffff">Sign up</text>
<text x="96" y="259.06" font-size="64" font-weight="800" letter-spacing="-2.88" fill="#181818">Lecture notes, one</text>
<text x="96" y="324.33" font-size="64" font-weight="800" letter-spacing="-2.88" fill="#181818">swipe at a time.</text>
<text x="96" y="376.42" font-size="19" fill="#4b4b4b">PARP is a vertical feed of slide notes written by APU students</text>
<text x="96" y="404.92" font-size="19" fill="#4b4b4b">and checked by lecturers. Search by module, save what helps,</text>
<text x="96" y="433.42" font-size="19" fill="#4b4b4b">and ask the author about a slide.</text>
