<text x="953.54" y="256.82" font-size="9.54" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="953.54" y="289.47" font-size="23.53" font-weight="750" letter-spacing="-0.59" fill="#181818">Normalisation, 1NF to</text>
<text x="953.54" y="311.82" font-size="23.53" font-weight="750" letter-spacing="-0.59" fill="#181818">3NF</text>
<rect x="953.54" y="322.37" width="240.68" height="46.61" rx="7.63" fill="#f4f4f4"/>
<text x="963.04" y="344.92" font-size="13.99" font-weight="650" fill="#181818">1NF</text>
<text x="999.41" y="344.74" font-size="11.45" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="999.41" y="358.34" font-size="11.45" fill="#4b4b4b">row.</text>
<rect x="953.54" y="377.93" width="240.68" height="46.61" rx="7.63" fill="#f4f4f4"/>
<text x="963.04" y="400.48" font-size="13.99" font-weight="650" fill="#181818">2NF</text>
<text x="999.41" y="400.31" font-size="11.45" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="999.41" y="413.91" font-size="11.45" fill="#4b4b4b">composite key.</text>
<rect x="953.54" y="433.49" width="240.68" height="46.61" rx="7.63" fill="#f4f4f4"/>
<text x="963.04" y="456.05" font-size="13.99" font-weight="650" fill="#181818">3NF</text>
<text x="999.41" y="455.87" font-size="11.45" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="1017.3" y="469.47" font-size="11.45" fill="#4b4b4b">columns.</text>
<rect x="953.54" y="489.06" width="240.68" height="42.63" rx="7.63" fill="#e9e9e9"/>
<text x="963.04" y="507.96" font-size="10.49" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="963.04" y="520.89" font-size="10.49" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
