<text x="722.39" y="172.38" font-size="3.6" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="722.39" y="185.11" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">Normalisation, 1NF to</text>
<text x="722.39" y="194.69" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">3NF</text>
<rect x="722.39" y="200.41" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="726.47" y="209.69" font-size="5.28" font-weight="650" fill="#181818">1NF</text>
<text x="742.06" y="209.79" font-size="4.32" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="742.06" y="215.61" font-size="4.32" fill="#4b4b4b">row.</text>
<rect x="722.39" y="225.05" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="726.47" y="234.33" font-size="5.28" font-weight="650" fill="#181818">2NF</text>
<text x="742.06" y="234.43" font-size="4.32" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="742.06" y="240.25" font-size="4.32" fill="#4b4b4b">composite key.</text>
<rect x="722.39" y="249.69" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="726.47" y="258.97" font-size="5.28" font-weight="650" fill="#181818">3NF</text>
<text x="742.06" y="259.07" font-size="4.32" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="749.73" y="264.89" font-size="4.32" fill="#4b4b4b">columns.</text>
<rect x="722.39" y="274.33" width="103.22" height="18.25" rx="2.88" fill="#e9e9e9"/>
<text x="726.47" y="282.07" font-size="3.96" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="726.47" y="287.6" font-size="3.96" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
<text x="636" y="335.31" font-size="14" font-weight="650" fill="#181818">Normalisation, 1NF to 3NF in one page</text>
<text x="636" y="355.28" font-size="12" fill="#777777">Aina Rahman · CT030-3-2</text>
