<text x="112.39" y="151.78" font-size="3.6" font-weight="650" fill="#777777">CT030-3-2 · Week 6</text>
<text x="112.39" y="164.5" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">Normalisation, 1NF to</text>
<text x="112.39" y="174.08" font-size="8.88" font-weight="750" letter-spacing="-0.22" fill="#181818">3NF</text>
<rect x="112.39" y="179.8" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="116.47" y="189.08" font-size="5.28" font-weight="650" fill="#181818">1NF</text>
<text x="132.06" y="189.18" font-size="4.32" fill="#4b4b4b">Atomic values. No repeating groups in a</text>
<text x="132.06" y="195" font-size="4.32" fill="#4b4b4b">row.</text>
<rect x="112.39" y="204.44" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="116.47" y="213.72" font-size="5.28" font-weight="650" fill="#181818">2NF</text>
<text x="132.06" y="213.82" font-size="4.32" fill="#4b4b4b">No partial dependency on part of a</text>
<text x="132.06" y="219.64" font-size="4.32" fill="#4b4b4b">composite key.</text>
<rect x="112.39" y="229.08" width="103.22" height="20.81" rx="2.88" fill="#f4f4f4"/>
<text x="116.47" y="238.36" font-size="5.28" font-weight="650" fill="#181818">3NF</text>
<text x="132.06" y="238.46" font-size="4.32" fill="#4b4b4b">No transitive dependency between non-key</text>
<text x="139.73" y="244.28" font-size="4.32" fill="#4b4b4b">columns.</text>
<rect x="112.39" y="253.72" width="103.22" height="18.25" rx="2.88" fill="#e9e9e9"/>
<text x="116.47" y="261.46" font-size="3.96" fill="#4b4b4b">Example: customer_name depends on customer_id,</text>
<text x="116.47" y="266.99" font-size="3.96" fill="#4b4b4b">not on order_id, so it moves to CUSTOMER_T.</text>
<text x="26" y="314.7" font-size="14" font-weight="650" fill="#181818">Normalisation, 1NF to 3NF in one page</text>
<text x="26" y="334.67" font-size="12" fill="#777777">Aina Rahman · CT030-3-2</text>
<rect x="14" y="357.08" width="289.59" height="59.19" rx="18" fill="#e9e9e9"/>
