services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notalah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notalah}
      POSTGRES_DB: ${POSTGRES_DB:-notalah}
    volumes:
      - notalah_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notalah_pgdata:
