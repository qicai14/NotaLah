services:
  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parp}
      POSTGRES_DB: ${POSTGRES_DB:-parp}
    volumes:
      - parp_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  parp_pgdata:
