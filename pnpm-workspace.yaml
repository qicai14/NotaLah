packages:
  - shared
  - client
  - server
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@tiptap/core': 3.31.3
  '@tiptap/extension-bubble-menu': 3.31.3
  '@tiptap/extension-floating-menu': 3.31.3
peerDependencyRules:
