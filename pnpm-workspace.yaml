packages:
  - shared
  - client
  - server
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  typescript: 7.0.2
  '@types/node': 24.19.2
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@types/node': 'catalog:'
  '@tiptap/core': 3.32.0
  '@tiptap/extension-bubble-menu': 3.32.0
  '@tiptap/extension-floating-menu': 3.32.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
allowBuilds:
  esbuild: true
# Supply-chain guard: npm releases must be 3 days old (minutes); the Vite+ toolchain stays on its newest release.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - vite-plus
  - vite
  - vitest
  - '@voidzero-dev/*'
  - 'oxlint*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - 'oxfmt'
  - '@oxfmt/*'
  - tsdown
  - rolldown
  # temporary (25 Oct): security patches GHSA-q7qp-rjg7-q26m (multer) and GHSA-27r3-jxmh-p828 (body-parser),
  # released 22 Oct 11:40 UTC; remove both lines once they are 3 days old
  - multer
  - body-parser
  - '@rolldown/*'
