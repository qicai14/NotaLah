packages:
  - shared
  - client
  - server
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@tiptap/core': 3.32.0
  '@tiptap/extension-bubble-menu': 3.32.0
  '@tiptap/extension-floating-menu': 3.32.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
allowBuilds:
  esbuild: true
# Supply-chain guard: npm releases must be 3 days old (minutes); the Vite+ toolchain stays on its newest release.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - vite-plus
  - vite
  - vitest
  - '@voidzero-dev/*'
  - 'oxlint*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - 'oxfmt'
  - '@oxfmt/*'
  - tsdown
  - rolldown
  - '@rolldown/*'
